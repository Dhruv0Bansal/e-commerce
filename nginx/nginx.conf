events {}

http {
  server {
    listen 8080;

    # Each location block maps a URL prefix to a backend service.
    # The service names (auth-service, product-service, etc.) are
    # resolved via Docker Compose's internal DNS - no hardcoded IPs.

    location /api/user {
      proxy_pass http://auth-service:5000;
    }

    location /api/product {
      proxy_pass http://product-service:5001;
    }

    location /api/cart {
      proxy_pass http://cart-service:5002;
    }

    location /api/inventory {
      proxy_pass http://inventory-service:5003;
    }

    location /api/checkout {
      proxy_pass http://checkout-service:5004;
    }

    # Frontend - everything else goes to the React dev server / static build
    location / {
      proxy_pass http://frontend:5173;
    }
  }
}
