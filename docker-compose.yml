services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./database/primary-init.sql:/docker-entrypoint-initdb.d/primary-init.sql:ro
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PRIMARY_HOST: postgres-primary
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./database/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c", "while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 1; done; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic product-created --partitions 1 --replication-factor 1; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-events --partitions 1 --replication-factor 1; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic clear-cart --partitions 1 --replication-factor 1"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - product-service
      - cart-service
      - inventory-service
      - checkout-service

  auth-service:
    build: ./services/auth-service
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/ecommerce
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

  product-service:
    build: ./services/product-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      PRIMARY_DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/ecommerce
      REPLICA_DATABASE_URL: postgresql://postgres:postgres@postgres-replica:5432/ecommerce
      JWT_SECRET: dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/product-service:/app
      - /app/node_modules

  cart-service:
    build: ./services/cart-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      JWT_SECRET: dev-secret-change-me
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/cart-service:/app
      - /app/node_modules

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      PRIMARY_DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/ecommerce
      REPLICA_DATABASE_URL: postgresql://postgres:postgres@postgres-replica:5432/ecommerce
      JWT_SECRET: dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/inventory-service:/app
      - /app/node_modules

  checkout-service:
    build: ./services/checkout-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/ecommerce
      JWT_SECRET: dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres-primary:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/checkout-service:/app
      - /app/node_modules

volumes:
  postgres_primary_data:
  postgres_replica_data:
